# Sviluppo locale. Non è un deploy. Le password qui sono solo per la macchina locale.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gg
      POSTGRES_PASSWORD: gg-local-only
      POSTGRES_DB: gg
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://gg:gg-local-only@postgres:5432/gg
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      - postgres
      - redis

