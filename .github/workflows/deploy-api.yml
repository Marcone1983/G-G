name: deploy-api
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the API or name the missing credential
        run: |
          set -euo pipefail
          missing=""
          [ -n "${VERCEL_TOKEN:-}" ] || missing="${missing} VERCEL_TOKEN"
          [ -n "${VERCEL_ORG_ID:-}" ] || missing="${missing} VERCEL_ORG_ID"
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing="${missing} VERCEL_PROJECT_ID"
          [ -n "${DATABASE_URL:-}" ] || missing="${missing} DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "EXTERNAL ACTION REQUIRED"
            echo "provider: Vercel"
            echo "missing:${missing}"
            echo "place: GitHub repository Marcone1983/G-G → Settings → Secrets and variables → Actions"
            echo "command: gh workflow run deploy-api.yml --ref main"
            echo "DATABASE_URL is server-side only. Do not put it in the APK."
            echo "Do not invent a domain. The public https origin is the URL Vercel returns."
            exit 2
          fi
          if [ -n "${XAI_API_KEY:-}" ]; then
            echo "LANGUAGE_CREDENTIAL github_secret=PRESENT value=NOT_PRINTED"
            echo "XAI_API_KEY is not synced by this workflow. vercel env ls returns 403 on this token."
          else
            echo "LANGUAGE_CREDENTIAL github_secret=ABSENT"
            echo "The Grok session file is not uploaded. Production narration stays ABSENT until XAI_API_KEY exists as a GitHub Actions secret and is set on the Vercel project."
          fi
          npm install --global vercel@62.1.0
          rm -rf .vercel
          # CLI 62 pull succeeds. The following env ls/env add call returns 403
          # team_unauthorized (Could not retrieve Project Settings) and, under
          # pipefail, aborts the deploy. DATABASE_URL is already on the project.
          # Do not print .vercel/.env.production.local.
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          if [ -f .vercel/.env.production.local ]; then
            echo "vercel_pull=OK env_file=PRESENT values=NOT_PRINTED"
          else
            echo "vercel_pull=OK env_file=ABSENT"
          fi
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
