name: deploy-api
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the API or name the missing credential
        run: |
          set -euo pipefail
          missing=""
          [ -n "${VERCEL_TOKEN:-}" ] || missing="${missing} VERCEL_TOKEN"
          [ -n "${VERCEL_ORG_ID:-}" ] || missing="${missing} VERCEL_ORG_ID"
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing="${missing} VERCEL_PROJECT_ID"
          [ -n "${DATABASE_URL:-}" ] || missing="${missing} DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "EXTERNAL ACTION REQUIRED"
            echo "provider: Vercel"
            echo "missing:${missing}"
            echo "place: GitHub repository Marcone1983/G-G → Settings → Secrets and variables → Actions"
            echo "command: gh workflow run deploy-api.yml --ref main"
            echo "DATABASE_URL is server-side only. Do not put it in the APK."
            echo "Do not invent a domain. The public https origin is the URL Vercel returns."
            exit 2
          fi
          npm install --global vercel@56.1.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          if ! vercel env ls production --token="$VERCEL_TOKEN" | grep -q '^DATABASE_URL'; then
            printf '%s' "$DATABASE_URL" | vercel env add DATABASE_URL production --token="$VERCEL_TOKEN"
          fi
          if [ -n "${XAI_API_KEY:-}" ]; then
            if ! vercel env ls production --token="$VERCEL_TOKEN" | grep -q '^XAI_API_KEY'; then
              printf '%s' "$XAI_API_KEY" | vercel env add XAI_API_KEY production --token="$VERCEL_TOKEN"
            fi
            echo "LANGUAGE_CREDENTIAL github_secret=PRESENT vercel_sync=ATTEMPTED value=NOT_PRINTED"
          else
            echo "LANGUAGE_CREDENTIAL github_secret=ABSENT"
            echo "The Grok Build session file is not on Vercel. Production narration stays ABSENT until XAI_API_KEY exists as a GitHub Actions secret."
          fi
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
