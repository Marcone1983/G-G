name: prediction-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/postgres
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read two parent group counts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install --quiet "psycopg[binary]"
          python3 scripts/postgres/parent_groups.py
