name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: production gate stays closed and cloud scripts refuse to pretend
        run: |
          set +e
          node --experimental-strip-types --test src/lib/gg/production-prep.test.ts
          node_code=$?
          python3 scripts/postgres/import_corpus.py
          import_code=$?
          python3 scripts/postgres/worker.py
          worker_code=$?
          bash scripts/postgres/backup.sh
          backup_code=$?
          set -e
          test "$node_code" -eq 0
          test "$import_code" -eq 2
          test "$worker_code" -eq 2
          test "$backup_code" -eq 2
      - name: contracts that do not need the scientific corpus
        run: node --experimental-strip-types --test src/lib/gg/production.test.ts src/lib/gg/scientific.test.ts src/lib/gg/contract.test.ts src/lib/gg/platform.test.ts src/lib/gg/phase4.test.ts
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
      - name: Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvmargs="-Xmx1g"
      - uses: actions/upload-artifact@v4
        with:
          name: gg-debug-apk
          path: android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
      - name: Release APK
        id: release
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secret is absent. Debug APK only."
            exit 0
          fi
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/gg-upload.jks
          printf 'storeFile=keystore/gg-upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties
          export PRODUCTION_API_BASE_URL="https://g-g-growverse420-4304.vercel.app"
          ./gradlew :app:assembleProductionRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.signed == 'true'
        with:
          name: gg-release-apk
          path: android/app/build/outputs/apk/production/release/*.apk
          if-no-files-found: error
