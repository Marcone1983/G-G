name: supabase-migrate
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/postgres
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe writes, then apply schema if the probe passes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pip install --quiet "psycopg[binary]"
          python3 scripts/postgres/status_remote.py
          python3 scripts/postgres/apply_remote.py
          python3 scripts/postgres/status_remote.py

