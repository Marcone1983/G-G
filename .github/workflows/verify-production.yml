name: verify-production
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Call the connected Vercel project and the G&G API
        run: |
          set -euo pipefail
          missing=""
          [ -n "${VERCEL_TOKEN:-}" ] || missing="${missing} VERCEL_TOKEN"
          [ -n "${VERCEL_ORG_ID:-}" ] || missing="${missing} VERCEL_ORG_ID"
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing="${missing} VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "EXTERNAL ACTION REQUIRED missing:${missing}"
            exit 2
          fi
          python3 - << 'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["VERCEL_TOKEN"]
          org = os.environ["VERCEL_ORG_ID"]
          project = os.environ["VERCEL_PROJECT_ID"]

          def call(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  "https://api.vercel.com" + path,
                  data=data,
                  method=method,
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as res:
                      raw = res.read().decode()
                      return res.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as err:
                  raw = err.read().decode(errors="replace")
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      payload = {"message": raw[:180]}
                  return err.code, payload

          status, proj = call("GET", f"/v9/projects/{project}?teamId={org}")
          print("project_http", status)
          if status != 200:
              err = proj.get("error") or {}
              print("project_error", err.get("code") or proj.get("message") or status)
              raise SystemExit(1)
          print("project_name", proj.get("name"))
          print("ssoProtection", json.dumps(proj.get("ssoProtection"), separators=(",", ":")))
          aliases = []
          for item in proj.get("alias") or []:
              if isinstance(item, dict) and item.get("domain"):
                  aliases.append(item["domain"])
              elif isinstance(item, str):
                  aliases.append(item)
          targets = (proj.get("targets") or {}).get("production") or {}
          for item in targets.get("alias") or []:
              if isinstance(item, str):
                  aliases.append(item)
              elif isinstance(item, dict) and item.get("domain"):
                  aliases.append(item["domain"])
          print("production_aliases", " ".join(dict.fromkeys(aliases)) or "NONE")

          status, env = call("GET", f"/v9/projects/{project}/env?teamId={org}")
          names = []
          if status == 200:
              for item in env.get("envs") or []:
                  names.append(f"{item.get('key')}:{'/'.join(item.get('target') or [])}")
          print("env_http", status)
          print("env_names", " ".join(names) or "NONE")

          status, deps = call("GET", f"/v6/deployments?projectId={project}&teamId={org}&target=production&limit=1")
          print("deployments_http", status)
          deployment = (deps.get("deployments") or [None])[0] or {}
          url = deployment.get("url") or ""
          ready = deployment.get("readyState") or deployment.get("state")
          dep_aliases = deployment.get("alias") or []
          print("latest_ready", ready)
          print("latest_url", url)
          print("latest_aliases", " ".join(dep_aliases) or "NONE")

          hosts = []
          for host in [*aliases, *dep_aliases, url]:
              host = str(host).removeprefix("https://").strip("/")
              if host and host not in hosts:
                  hosts.append(host)

          def probe(host):
              req = urllib.request.Request(
                  f"https://{host}/api/v1/health",
                  headers={"Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      body = res.read(2000).decode(errors="replace")
                      return res.status, res.headers.get("location"), body
              except urllib.error.HTTPError as err:
                  body = err.read(500).decode(errors="replace")
                  return err.code, err.headers.get("location"), body

          protected = False
          for host in hosts:
              code, location, body = probe(host)
              kind = "json" if body.lstrip().startswith("{") else "other"
              service = ""
              if kind == "json":
                  try:
                      parsed = json.loads(body)
                      service = str(parsed.get("service") or "")
                      print("health", host, code, "service=" + service, "ok=" + str(parsed.get("ok")))
                      continue
                  except json.JSONDecodeError:
                      kind = "other"
              sso = "vercel.com/sso" in (location or "") or "Protected by Vercel" in body
              print("health", host, code, "sso" if sso else kind, "location=" + (location or ""))
              protected = protected or sso

          if protected:
              print("protection_action", "set ssoProtection.deploymentType=preview so production domains are public")
              status, updated = call(
                  "PATCH",
                  f"/v9/projects/{project}?teamId={org}",
                  {"ssoProtection": {"deploymentType": "preview"}},
              )
              print("protection_http", status)
              if status != 200:
                  err = updated.get("error") or {}
                  print("protection_error", err.get("code") or updated.get("message") or status)
              else:
                  print("ssoProtection_after", json.dumps(updated.get("ssoProtection"), separators=(",", ":")))
                  for host in hosts:
                      code, location, body = probe(host)
                      if body.lstrip().startswith("{"):
                          parsed = json.loads(body)
                          print("health_after", host, code, "service=" + str(parsed.get("service") or ""), "ok=" + str(parsed.get("ok")))
                      else:
                          sso = "vercel.com/sso" in (location or "") or "Protected by Vercel" in body
                          print("health_after", host, code, "sso" if sso else "other")
          PY
