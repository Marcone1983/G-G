name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          set +o pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build the debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleEmulatorDebug --no-daemon
      - name: Verify the APK
        working-directory: android
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/emulator/debug/app-emulator-debug.apk"
          test -f "$apk"
          aapt="$(echo "${ANDROID_SDK_ROOT}/build-tools/"*/aapt | awk '{print $1}')"
          badging="$("$aapt" dump badging "$apk")"
          echo "$badging" | head -n 20
          echo "$badging" | grep -q "package: name='science.gg.breeding'"
          echo "$badging" | grep -q "versionName='1.5.1'"
          echo "$badging" | grep -q "versionCode='7'"
          tmp="$(mktemp -d)"
          unzip -o "$apk" "classes*.dex" -d "$tmp" >/dev/null
          if grep -a -E "DATABASE_URL|XAI_API_KEY|service_role|URL HTTPS|Server scientifico" "$tmp"/classes*.dex; then
            echo "FORBIDDEN_STRING_IN_APK"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gg-debug-1.5.0
          path: android/app/build/outputs/apk/emulator/debug/app-emulator-debug.apk
          if-no-files-found: error
