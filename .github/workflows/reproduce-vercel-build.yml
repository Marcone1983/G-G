name: reproduce-vercel-build
on:
  push:
    branches: [fix/vercel-build-repro]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the way Vercel does
        run: npm install --omit=dev --no-audit --no-fund
      - name: Same build command Vercel runs
        run: npm run build
