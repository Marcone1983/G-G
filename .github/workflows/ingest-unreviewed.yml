name: ingest-unreviewed
on:
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Insert one unreviewed Europe PMC metadata row
        run: node --experimental-strip-types scripts/research/ingest-one-unreviewed.ts
